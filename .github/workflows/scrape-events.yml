name: Auto Scrape & Update Concert Events

on:
  schedule:
    # Run every day at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Chrome & Dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable fonts-ipafont-gothic fonts-wqy-zenhei fonts-thai-tlwg fonts-kacst fonts-freefont-ttf libxss1 --no-install-recommends

      - name: Install NPM Dependencies
        run: npm ci

      - name: Scrape Live Site
        run: node scripts/scrape_live.js

      - name: Parse Live Events
        run: node scripts/parse_live.js

      - name: Merge & Export All Formats (JSON, CSV, XLSX, TS)
        run: node scripts/merge_events.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add events.json events.csv events.xlsx src/data/ wayback_data/
          if git diff --staged --quiet; then
            echo "No changes in events dataset."
          else
            git commit -m "chore(data): auto-update concert events dataset [skip ci]"
            git push
          fi
